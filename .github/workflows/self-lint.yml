name: Lint

# Lints the workflows, the actions and their scripts of this repository, and runs the script
# tests. Not for consumers.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: self-lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: '1.31.1'

jobs:
  lint:
    name: Lint and test the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location --fail --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Install zizmor and bats
        run: |
          set -euo pipefail
          pipx install "zizmor==${ZIZMOR_VERSION}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bats

      - name: Lint
        run: scripts/lint.sh

      - name: Check the pins
        if: ${{ !cancelled() }}
        run: scripts/check-pins.sh

      - name: Test the scripts
        if: ${{ !cancelled() }}
        run: bats tests
