name: Self-test

# Runs the pipeline of this repository against the project in fixtures/library, so that a change
# to a workflow is tried on a real Kreate build before anyone pins it. Not for consumers.
#
# The fixture builds with a released Kreate. The snapshot and the release stage need a repository
# token and are proven by the projects that use them.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pipeline:
    name: Pipeline on the fixture
    uses: $/.github/workflows/pipeline.yml
    permissions:
      contents: write
      actions: write
      security-events: write
      id-token: write
      attestations: write
      pages: write
      pull-requests: read
    with:
      # The whole pipeline, whatever the event: this run tests the workflows, not a change of the
      # fixture.
      stages: check,security,docs,benchmark
      config: |
        working-directory: fixtures/library
        paths:
          ignore: []
        policy:
          push-develop: { overrides: { security: { repository-scan: { enabled: true }, sbom: { enabled: true } } } }
          push-main: { overrides: { security: { repository-scan: { enabled: true }, sbom: { enabled: true } } } }
          pull-request: { overrides: { security: { repository-scan: { enabled: true }, sbom: { enabled: true } } } }
        check:
          tasks: [check]
          reports:
            upload: always
          reproducible:
            enabled: true
            tasks: [clean, jar]
        security:
          gradle:
            enabled: false
          dependency-submission:
            enabled: false
        docs:
          engine: none
        benchmark:
          tasks: [help]
          summary: ""
          paths: ["fixtures/library/build/reports/**"]

  # A configuration with a mistake has to stop the plan, and nothing after it may start.
  broken-configuration:
    name: A broken configuration stops the plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan with an unknown option
        id: plan
        continue-on-error: true
        uses: $/actions/plan
        with:
          config: |
            check:
              taskz: [check]
          token: ${{ github.token }}

      - name: Expect the plan to have failed
        env:
          KW_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          if [ "$KW_OUTCOME" != "failure" ]; then
            echo "::error::The plan accepted an unknown option."
            exit 1
          fi

  # cmd.exe cuts off a variable of 8191 characters or more, and the resolved configuration of a
  # real project is that long. Setting up Visual Studio has to leave such a variable as it is,
  # and its clang-tidy has to be the one that reads its STL.
  # The plan runs on Linux, as in every workflow: it needs yq.
  long-variable-plan:
    name: Plan a configuration with a long variable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      config: ${{ steps.plan.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write a configuration with a long variable
        id: long
        run: |
          padding="$(printf 'x%.0s' $(seq 1 9000))"
          {
            echo "config<<KW_CONFIG_END"
            echo "working-directory: fixtures/library"
            echo "tools: { msvc: true, clang-tidy: true }"
            echo "env: { KOTLIN_WORKFLOW_PADDING: $padding }"
            echo "KW_CONFIG_END"
          } >>"$GITHUB_OUTPUT"

      - name: Plan
        id: plan
        uses: $/actions/plan
        with:
          config: ${{ steps.long.outputs.config }}
          token: ${{ github.token }}

  long-variable:
    name: Visual Studio next to a long variable
    needs: long-variable-plan
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KW_CONFIG: ${{ needs.long-variable-plan.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: $/actions/setup
        with:
          config: ${{ env.KW_CONFIG }}
          cache: disabled

      # The configuration is read again, as the steps of check.yml read it after the setup.
      - name: Expect the long variables whole and the compiler on the PATH
        shell: bash
        env:
          KW_WORKING_DIRECTORY: ${{ fromJSON(env.KW_CONFIG).working-directory }}
        run: |
          if [ "${#KOTLIN_WORKFLOW_PADDING}" -ne 9000 ]; then
            echo "::error::KOTLIN_WORKFLOW_PADDING is ${#KOTLIN_WORKFLOW_PADDING} characters long, not 9000."
            exit 1
          fi
          if [ "$KW_WORKING_DIRECTORY" != "fixtures/library" ]; then
            echo "::error::KW_CONFIG did not survive the setup."
            exit 1
          fi
          command -v cl.exe

      # clang-tidy reads the STL of Visual Studio, which refuses a Clang older than its own. The
      # file uses the STL and exceptions, as a JNI library does, and is checked the way CMake's
      # CXX_CLANG_TIDY checks it next to cl.
      - name: Expect clang-tidy to read the STL of Visual Studio
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'kotlin-workflow-tidy.cpp'
          Set-Content -Path $source -Encoding ascii -Value @(
            '#include <string>'
            '#include <vector>'
            'int main() {'
            '    std::vector<std::string> names;'
            '    try { names.emplace_back("pipe"); } catch (...) { throw; }'
            '    return static_cast<int>(names.size());'
            '}'
          )
          (Get-Command clang-tidy).Source
          clang-tidy --version
          clang-tidy $source '--checks=-*' '--extra-arg-before=--driver-mode=cl' -- /EHsc /std:c++20 /W4
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Two runners from one line of configuration, and a release that is only rehearsed. The release
  # builds natives on Linux and Windows with a stand-in for kreateJniStage and hands them to the
  # build it rehearses; the Windows runner sets up Visual Studio first.
  matrix-and-dry-run:
    name: Matrix and dry run
    uses: $/.github/workflows/pipeline.yml
    permissions:
      contents: write
      actions: write
      security-events: write
      id-token: write
      attestations: write
      pages: write
      pull-requests: read
    with:
      stages: check,release
      dry-run: true
      config: |
        working-directory: fixtures/library
        policy:
          push-develop: { os: [ubuntu-latest, windows-latest] }
          push-main: { os: [ubuntu-latest, windows-latest] }
          pull-request: { os: [ubuntu-latest, windows-latest] }
          workflow-dispatch: { os: [ubuntu-latest, windows-latest] }
        check:
          reports:
            upload: never
        release:
          gate:
            branch: ""
          publications:
            discovery: explicit
            list:
              - path: com/davils/kotlinworkflow/fixture/kotlin-workflow-fixture
                artifact: kotlin-workflow-fixture
                task: ":publishMavenPublicationToDavilsRepository"
          sign: false
          github-release:
            enabled: false
          smoke:
            enabled: false
        native:
          runners:
            - { platform: linux-x86_64, runs-on: ubuntu-latest }
            - { platform: windows-x86_64, runs-on: windows-latest }
          stages: [release]
          stage-task: kotlinWorkflowStage
          build-tasks: []
          tools:
            msvc: true
            ninja: true
            clang-tidy: true
