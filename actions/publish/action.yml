name: Publish
description: Uploads publications to the Maven repository with the repository token in scope.

inputs:
  config:
    description: The resolved configuration as JSON.
    required: true
  tasks:
    description: A JSON list of upload tasks, run in order.
    required: true
  args:
    description: A JSON list of arguments of every upload. Empty takes gradle.args of the configuration.
    default: ''
  snapshot:
    description: true publishes a snapshot, which is never signed.
    default: 'false'
  maven-username:
    description: The name of the repository token.
    required: true
  maven-password:
    description: The secret of the repository token.
    required: true
  signing-key:
    description: The ASCII-armoured signing key of a release.
    default: ''
  signing-key-id:
    description: The id of the signing key.
    default: ''
  signing-password:
    description: The password of the signing key.
    default: ''

runs:
  using: composite
  steps:
    - name: Upload
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_CONFIG: ${{ inputs.config }}
        KW_TASKS: ${{ inputs.tasks }}
        KW_ARGS: ${{ inputs.args }}
        KW_SNAPSHOT: ${{ inputs.snapshot }}
        KW_MAVEN_USERNAME: ${{ inputs.maven-username }}
        KW_MAVEN_PASSWORD: ${{ inputs.maven-password }}
        KW_SIGNING_KEY: ${{ inputs.signing-key }}
        KW_SIGNING_KEY_ID: ${{ inputs.signing-key-id }}
        KW_SIGNING_PASSWORD: ${{ inputs.signing-password }}
      run: '"$KW_ACTION_PATH/publish.sh"'
