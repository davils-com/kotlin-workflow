name: Gradle
description: Runs Gradle invocations, one after the other, each from a JSON list of tasks.

inputs:
  invocations:
    description: A JSON list of invocations, each a list of tasks and their options. An empty invocation is skipped.
    required: true
  args:
    description: A JSON list of arguments added to every invocation.
    default: '[]'
  configuration-cache:
    description: true, false or omit. A job that holds a secret uses false.
    default: omit
  working-directory:
    description: Where the Gradle wrapper is.
    default: '.'
  github-token:
    description: >-
      A token the build reads as GITHUB_TOKEN, such as for the rate limit of the GitHub API.
      Empty leaves GITHUB_TOKEN out. Only for a job whose token cannot write anything that matters.
    default: ''

runs:
  using: composite
  steps:
    - name: Run Gradle
      if: runner.os != 'Windows'
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_INVOCATIONS: ${{ inputs.invocations }}
        KW_ARGS: ${{ inputs.args }}
        KW_CONFIGURATION_CACHE: ${{ inputs.configuration-cache }}
        KW_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        KW_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$KW_ACTION_PATH/run.sh"'

    # Git Bash renames variables of Windows, SystemRoot to SYSTEMROOT among them. A build that
    # hands its environment on then holds both names, and MSBuild starts no compiler. Gradle
    # therefore runs in the environment of Windows itself.
    - name: Run Gradle on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_INVOCATIONS: ${{ inputs.invocations }}
        KW_ARGS: ${{ inputs.args }}
        KW_CONFIGURATION_CACHE: ${{ inputs.configuration-cache }}
        KW_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        KW_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '& "$env:KW_ACTION_PATH/run.ps1"'
