name: Native stage
description: Checks the stage a native runner built and keeps it as an artifact for the publishing job of the run.

inputs:
  config:
    description: The resolved configuration as JSON.
    required: true
  platform:
    description: The platform native.runners declares for this runner, such as windows-x86_64.
    required: true
  upload:
    description: Whether to keep the stage as the artifact kotlin-workflow-native-<platform>.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check the stage
      id: check
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_CONFIG: ${{ inputs.config }}
        KW_PLATFORM: ${{ inputs.platform }}
      run: '"$KW_ACTION_PATH/check.sh"'

    - name: Keep the stage
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kotlin-workflow-native-${{ inputs.platform }}
        path: ${{ steps.check.outputs.directory }}
        retention-days: ${{ fromJSON(inputs.config).retention.native }}
        if-no-files-found: error
