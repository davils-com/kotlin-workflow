name: Setup
description: Prepares a job for Gradle - environment, JDK, Gradle with its cache, native tools.

inputs:
  config:
    description: The resolved configuration as JSON.
    required: true
  cache:
    description: read-write, read-only or disabled. A job that holds a secret uses disabled.
    default: read-only
  tools:
    description: >-
      Which native tools to install: true for those of `tools`, native for those of `tools` and
      `native.tools`, false for none.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Export the environment
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_CONFIG: ${{ inputs.config }}
      run: '"$KW_ACTION_PATH/export-env.sh"'

    - name: Set up the JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: ${{ fromJSON(inputs.config).jdk.distribution }}
        java-version: ${{ fromJSON(inputs.config).jdk.version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        validate-wrappers: ${{ fromJSON(inputs.config).gradle.validate-wrappers }}
        cache-read-only: ${{ inputs.cache != 'read-write' }}
        cache-disabled: ${{ inputs.cache == 'disabled' }}

    - name: Choose the native tools
      id: tools
      if: inputs.tools != 'false'
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_CONFIG: ${{ inputs.config }}
        KW_TOOLS: ${{ inputs.tools }}
      run: '"$KW_ACTION_PATH/tools.sh"'

    # Before the installation, which then finds the CMake and the Ninja of Visual Studio.
    - name: Set up the developer environment of Visual Studio
      id: msvc
      if: inputs.tools != 'false' && runner.os == 'Windows' && fromJSON(steps.tools.outputs.tools).msvc
      shell: pwsh
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
      run: '& "$env:KW_ACTION_PATH/msvc.ps1"'

    - name: Hand the developer environment of Visual Studio on
      if: steps.msvc.outcome == 'success'
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_BEFORE: ${{ steps.msvc.outputs.before }}
        KW_AFTER: ${{ steps.msvc.outputs.after }}
        KW_CLANG_TIDY: ${{ fromJSON(steps.tools.outputs.tools).clang-tidy }}
      run: '"$KW_ACTION_PATH/msvc-env.sh"'

    - name: Install native tools
      if: inputs.tools != 'false'
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
        KW_TOOLS: ${{ steps.tools.outputs.tools }}
      run: '"$KW_ACTION_PATH/install-tools.sh"'

    - name: Install Trivy
      if: inputs.tools == 'true' && fromJSON(inputs.config).tools.trivy != ''
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        # The project pins the version in its configuration.
        version: ${{ fromJSON(inputs.config).tools.trivy }} # zizmor: ignore[unpinned-tools]
        path: ${{ runner.temp }}

    - name: Refuse local development state
      if: fromJSON(inputs.config).check.local-state-guard
      shell: bash
      env:
        KW_ACTION_PATH: ${{ github.action_path }}
      run: '"$KW_ACTION_PATH/guard-local-state.sh"'
